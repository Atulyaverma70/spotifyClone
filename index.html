<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <navbar>
        <ul>
            <li class="brand"><img src="logo.png" alt="spotify">Spotify</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </navbar>
    <div class="container">
        <div class="songList">
            <h1>Best of NCS</h1>
            <div class="songItemContainer">
                <div class="songItems">
                    <img  alt="1" >
                    <span class="songName">Let me Love you</span>
                    <span class="songListPlay"><span class="timeStamp">05:34 <i id="0" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">Trap Cartel</span>
                    <span class="songListPlay"><span class="timeStamp">03:35 <i id="1" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">They mad</span>
                    <span class="songListPlay"><span class="timeStamp">04:34 <i id="2"class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">Rick the kid</span>
                    <span class="songListPlay"><span class="timeStamp">04:37 <i id="3" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">Farji song</span>
                    <span class="songListPlay"><span class="timeStamp">03:36 <i id="4" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">The Safety Dance</span>
                    <span class="songListPlay"><span class="timeStamp">04:58 <i id="5" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">Back it up</span>
                    <span class="songListPlay"><span class="timeStamp">03:39 <i id="6" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">aise he song</span>
                    <span class="songListPlay"><span class="timeStamp">04:45 <i id="7" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
                <div class="songItems">
                    <img alt="1" >
                    <span class="songName">True Love Intesteller</span>
                    <span class="songListPlay"><span class="timeStamp">03:24 <i id="8" class="fa-solid fa-circle-play songItemPlay"></i></span></span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>
    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <i class="fa-solid fa-2x fa-backward"></i>
            <i class="fa-solid fa-2x fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-2x fa-forward"></i>

        </div>
        <div class="songInfo">
            <img src="playing.gif" width="49px" height="27px" srcset="" id="gif">Let me Love you
        </div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
